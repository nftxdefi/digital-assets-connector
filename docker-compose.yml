services:
  digital-assets:
    build: ./app
    env_file: .env
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - history-data:/data   # transaction history cache (safe to delete; it is rebuilt)

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7   # pinned Nov 11, 2026; update on purpose (see the runbook)
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - digital-assets

volumes:
  history-data:
